name: Pre-Commit Checks

on:
  pull_request:
  push:
    branches: [ main, development ]

env:
  RUFF_VERSION: 0.14.10

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install requirements
        run: |
          pip install -U pip
          pip install pylint
          pip install -U black
          pip install .[dev]
          pip install wandb
          pip install tqdm
      - name: Run black
        run: |
          python -m black .
      - uses: pre-commit/action@v3.0.0

  ruff-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - uses: astral-sh/ruff-action@v3.5.1
        with:
          version: ${{ env.RUFF_VERSION }}
      - run: ruff check

