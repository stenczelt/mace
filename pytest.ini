[pytest]
# Minimum pytest version
minversion = 6.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers - register all custom markers
markers =
    unit: Fast unit tests with no I/O or subprocesses (deselect with '-m "not unit"')
    integration: Integration tests with file I/O, model training, or subprocesses (deselect with '-m "not integration"')
    slow: Very slow integration tests (>60s per file) - subset of integration (deselect with '-m "not slow"')
    benchmark: Performance benchmarks (skipped by default, run with '--benchmark-only')

# Default options
addopts =
    -v
    --strict-markers
    --tb=short

# Console output
console_output_style = progress
